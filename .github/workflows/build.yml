name: Build Masjid Silent

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q MasjidSilent-PlayStore-1.0.0.zip -d source

      - name: Build Android App Bundle
        working-directory: source/MasjidSilent-PlayReady
        run: gradle :app:bundleRelease --no-daemon -Pkotlin.jvm.target.validation.mode=warning
    

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MasjidSilent-release-AAB
          path: source/MasjidSilent-PlayReady/app/build/outputs/bundle/release/*.aab
